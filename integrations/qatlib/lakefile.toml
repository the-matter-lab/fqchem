name = "fqchem_kitaev"
version = "0.1.0"
defaultTargets = ["FQChemQatlib", "FQChemKitaev"]

[[require]]
name = "Qatlib"
git = "https://github.com/quantum-atlas-ai/qatlib.git"
rev = "f76f71a7c5cd19a31c251d0feeab09c75a758d69"

[[lean_lib]]
name = "FQChemKitaev"
globs = ["FQChemKitaev", "FQChemKitaev.+"]

[[lean_lib]]
name = "FQChemQatlib"
globs = ["FQChemQatlib", "FQChemQatlib.+"]

[[lean_lib]]
name = "FQChem"
srcDir = "../.."
roots = []
globs = [
  "FQChem.StatePrep.VariationalOptimization.RayleighRitz",
  "FQChem.StatePrep.VariationalOptimization.VQE",
  "FQChem.Complexity.ElectronicStructure",
  "FQChem.Complexity.ElectronicStructureOperators",
  "FQChem.Complexity.ElectronicStructurePauli",
]
