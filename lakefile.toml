name = "fqchem"
version = "0.1.0"
defaultTargets = ["FQChem", "FQChemForShor"]

[[require]]
name = "aaronsonAmbainisPort"
path = "integrations/aaronson-ambainis"

[[require]]
name = "ForShor"
git = "https://github.com/VerifiedQC/ForShor.git"
rev = "a4628e560f4082df75491b9490b0585013bf99ac"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "FQChem"
roots = []
globs = [
  "FQChem",
  "FQChem.Complexity.*",
  "FQChem.StatePrep.*",
  "FQChem.Dynamics.*",
  "FQChem.Properties.*",
  "FQChem.Multiscale.*",
]

[[lean_lib]]
name = "FQChemForShor"
srcDir = "integrations/forshor"
