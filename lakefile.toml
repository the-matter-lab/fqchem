name = "fqchem"
version = "0.1.0"
defaultTargets = ["FQChem"]

[[require]]
name = "aaronsonAmbainisPort"
path = "integrations/aaronson-ambainis"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "FQChem"
roots = []
globs = [
  "FQChem",
  "FQChem.Complexity.*",
  "FQChem.StatePrep.*",
  "FQChem.Dynamics.*",
  "FQChem.Properties.*",
  "FQChem.Multiscale.*",
]
