name = "formal_qchem"
version = "0.2.0"
defaultTargets = ["FormalQChem", "LegacyImports"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "FormalQChem"
roots = []
globs = [
  "FormalQChem",
  "FormalQChem.StatePrep.*",
  "FormalQChem.Dynamics.*",
  "FormalQChem.Properties.*",
  "FormalQChem.Multiscale.*",
]

[[lean_lib]]
name = "LegacyImports"
srcDir = "compat"
globs = ["FormalQChem.Theorems.+", "FormalQChem.Proofs.+"]
