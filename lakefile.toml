name = "formal_qchem"
version = "0.2.0"
defaultTargets = ["FormalQChem", "LegacyImports"]

[[require]]
name = "aaCompat"
path = "integrations/aaronson-ambainis"

[[require]]
name = "AaronsonAmbainis"
git = "https://github.com/physical-superintelligence/aaronson-ambainis.git"
rev = "2a6ceaef872ae993708950f951989134084b851a"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "FormalQChem"
roots = []
globs = [
  "FormalQChem",
  "FormalQChem.Complexity.*",
  "FormalQChem.StatePrep.*",
  "FormalQChem.Dynamics.*",
  "FormalQChem.Properties.*",
  "FormalQChem.Multiscale.*",
]

[[lean_lib]]
name = "LegacyImports"
srcDir = "compat"
globs = ["FormalQChem.Theorems.+", "FormalQChem.Proofs.+"]
