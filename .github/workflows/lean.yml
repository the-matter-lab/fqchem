name: Lean
on: [push, pull_request]
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch compiled dependencies
        run: lake exe cache get Mathlib
      - run: lake build
      - run: lake env lean test/Audit.lean
      - run: python3 scripts/theorem_graph/generate.py --check
