name: Lean
on: [push, pull_request]
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch compiled dependencies
        run: lake exe cache get Mathlib
      - run: lake build
      - run: lake env lean test/Audit.lean
      - run: python3 scripts/theorem_graph/audit_axioms.py --project library
      - run: python3 scripts/theorem_graph/generate.py
      - name: Upload compiled library graph
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-graph
          path: |
            docs/theorems/library.js
            docs/theorems/library.md
            docs/theorems/library-axioms.js
          if-no-files-found: error
          retention-days: 2

  kitaev:
    uses: ./.github/workflows/kitaev.yml

  atlas:
    name: Publish verified atlas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [proofs, kitaev]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fqchem-publish-atlas
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-graph'
          path: docs/theorems
          merge-multiple: true
      - name: Assemble the atlas and advance its publication branch
        env:
          FQCHEM_GITHUB_STARS: ${{ github.event.repository.stargazers_count }}
        run: bash scripts/theorem_graph/publish.sh

  review-catalog:
    name: Verify paper coverage
    if: github.event_name == 'pull_request'
    needs: [proofs, kitaev]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-graph'
          path: docs/theorems
          merge-multiple: true
      - run: python3 scripts/theorem_graph/literature.py
