name: Kitaev reduction
on: [push, pull_request]
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qatlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: integrations/qatlib
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch the pinned Mathlib dependencies of the integration
        run: |
          lake --json query +FQChemKitaev:transImports > "$RUNNER_TEMP/kitaev-modules.json"
          jq -r '.[] | select(startswith("Mathlib."))' "$RUNNER_TEMP/kitaev-modules.json" |
            sort -u | xargs -r lake exe cache get
      - run: lake build
      - run: lake env lean test/Audit.lean
      - run: python3 ../../scripts/theorem_graph/generate.py --project kitaev --check
