name: Qatlib integration
on: workflow_call
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qatlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: integrations/qatlib
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch the pinned Mathlib dependencies of the integration
        run: |
          lake --json query +FQChemQatlib:transImports > "$RUNNER_TEMP/kitaev-modules.json"
          jq -r '.[] | select(startswith("Mathlib."))' "$RUNNER_TEMP/kitaev-modules.json" |
            sort -u | xargs -r lake exe cache get
      - run: lake build
      - run: lake env lean test/Audit.lean
      - run: python3 ../../scripts/theorem_graph/audit_axioms.py --project kitaev
      - run: python3 ../../scripts/theorem_graph/generate.py --project kitaev
      - name: Upload compiled kitaev graph
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitaev-graph
          path: |
            docs/theorems/kitaev.js
            docs/theorems/kitaev.md
            docs/theorems/kitaev-axioms.js
          if-no-files-found: error
          retention-days: 2
