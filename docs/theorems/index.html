    * { box-sizing: border-box }
    body { margin: 0; font: 16px/1.5 Inter, system-ui, sans-serif; background: var(--paper); color: var(--ink) }
    main { max-width: 1340px; padding: 40px clamp(16px,3vw,52px); margin: auto }

    .brand { font-weight: 700; text-decoration: none }
    .repo-link { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600 }
    .repo-link:hover { border-color: var(--accent); background: var(--tint) }
    .topbar a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
    .repo-stars { display: inline-flex; align-items: center; gap: 4px; padding-left: 8px; border-left: 1px solid var(--line); font-variant-numeric: tabular-nums }
    .repo-stars:has(#star-count:empty) { display: none }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
    .filters { display: flex; flex-wrap: wrap; gap: 14px; margin: 26px 0 16px }
    label { display: grid; gap: 3px; font-size: 13px; color: var(--muted) }
    label:first-child { flex: 1; min-width: min(260px,100%) }
    input, select { padding: 9px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit }
    .workspace { display: grid; grid-template-columns: minmax(200px,26%) 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel) }
    aside { padding: 15px; border-right: 1px solid var(--line) }
    #count { font-size: 14px; color: var(--muted); margin: 0 0 12px }
    #results { overflow-y: auto; max-height: 68vh }
    button { font: inherit; color: inherit; cursor: pointer }
    .result { width: 100%; text-align: left; padding: 8px; border: 0; background: transparent; border-radius: 4px; overflow-wrap: anywhere }
    .result:hover, .result[aria-current="true"] { background: var(--tint) }
    small { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere }
    article { min-width: 0; padding: clamp(15px,2.4vw,34px) }
    #module { margin: 0 0 4px; color: var(--muted); overflow-wrap: anywhere; font-size: 14px }
    #source { display: inline-block; margin: 8px 0 20px }
    .diagram { position: relative; display: grid; grid-template-columns: 1fr .9fr 1fr; gap: 5%; align-items: center; padding: 12px 0; min-height: 170px; border-block: 1px solid var(--line) }
    .column { min-width: 0; position: relative; z-index: 1 }
    .node { display: block; position: relative; width: 100%; font-size: 14px; margin: 8px 0; padding: 8px; text-align: left; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 5px }
    button.node:hover { border-color: var(--accent) }
    .selected { background: var(--tint); border-color: var(--accent) }
    #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible }
    #wires path, #wires line { stroke: var(--accent) }
    #wires marker path { fill: var(--accent) }
    .empty, .legend { font-size: 13px; color: var(--muted) }
    @media (max-width: 760px) {
      main { padding-top: 18px }
      .workspace { grid-template-columns: 1fr }
      aside { border: 0; border-bottom: 1px solid var(--line) }
      #results { max-height: 16vh }
      .diagram { grid-template-columns: 1fr; gap: 16px }
      #wires { display: none }
    }
  </style>

  <h1>Theorem dependencies</h1>
  <div class="filters">
    <label>Find a theorem or method<input id="search" type="search" placeholder="e.g. VMC, qubitization, Kitaev" autocomplete="off"></label>
    <label>Chapter<select id="chapter"><option value="">All chapters</option></select></label>
  </div>
  <div class="workspace">
    <aside><p id="count" aria-live="polite"></p><nav id="results" aria-label="Matching theorems"></nav></aside>
    <article aria-live="polite">
      <p id="module"></p><h2 id="title"></h2><a id="source">Open Lean declaration</a>
      <div class="diagram" id="diagram">
        <svg id="wires" aria-hidden="true"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z"/></marker></defs><g></g></svg>
        <section class="column"><h3>Prerequisites</h3><div id="before"></div></section>
        <section class="column"><h3>Selected theorem</h3><div id="current"></div></section>
        <section class="column"><h3>Used by</h3><div id="after"></div></section>
      </div>
      <p class="legend">Arrows follow the proof from prerequisite to result. A dashed arrow passes through a local definition or compiler helper. Select a neighbor to follow the chain.</p>
    </article>
  </div>
</main>
<script>
"use strict";
const theorems = [];
const nodeIds = new Map();
function addTheoremGraph(nodes) {
  const localIds = nodes.map(n => {
    const key = n.module + "." + n.name;
    if (!nodeIds.has(key)) {
      nodeIds.set(key, theorems.length);
      theorems.push({...n, deps: [], users: []});
    }
    return nodeIds.get(key);
  });
  nodes.forEach((n, i) => {
    if (!n.shared) theorems[localIds[i]].deps = n.deps.map(([j, kind]) => [localIds[j], kind]);
  });
}
</script>
<script src="library.js"></script>
<script src="kitaev.js"></script>
<script>
const byId = id => document.getElementById(id);
if (location.protocol === "https:") {
  fetch("https://api.github.com/repos/the-matter-lab/fqchem", { credentials: "omit" })
    .then(response => response.ok ? response.json() : null)
    .then(repo => {
      if (Number.isSafeInteger(repo?.stargazers_count) && repo.stargazers_count >= 0)
        byId("star-count").textContent = repo.stargazers_count.toLocaleString();
    }).catch(() => { /* Keep the count captured at publication when GitHub is unavailable. */ });
}
const short = n => n.name.split(".").at(-1);
const chapter = n => n.external ? "Upstream" : n.module.startsWith("FQChemKitaev") ? "Complexity" : n.module.split(".")[1];
const labels = {StatePrep:"State preparation", Dynamics:"Dynamics", Properties:"Properties", Multiscale:"Multiscale", Complexity:"Complexity", Upstream:"Upstream"};
for (const c of new Set(theorems.map(chapter).sort())) byId("chapter").add(new Option(labels[c] || c,c));
theorems.forEach((node, i) => node.deps.forEach(([j,kind]) => theorems[j].users.push([i,kind])));
let selected;
function card(i, kind, mode) {
  const n = theorems[i];
  const el = document.createElement(mode === "selected" ? "div" : "button");
  el.className = mode === "result" ? "result" : "node " + mode;
  el.textContent = short(n);
  const meta = document.createElement("small");
  meta.textContent = n.module.split(".").at(-1) + (n.private ? " · private" : "") + (n.external ? " · upstream" : "");
  el.append(meta);
  el.title = n.name;
  if (mode !== "selected") el.onclick = () => choose(i);
  if (mode === "result") el.setAttribute("aria-current", String(i === selected));
  if (kind) el.dataset.edge = kind;
  return el;
}
const aliases = {
  VariationalMonteCarlo: "VMC variational Monte Carlo", DiffusionMonteCarlo: "DMC diffusion Monte Carlo",
  AFQMC: "auxiliary field quantum Monte Carlo", HubbardProjection: "AFQMC", GaussianAuxiliaryField: "AFQMC",
  FCIQMC: "full configuration interaction quantum Monte Carlo", MatrixProductStates: "MPS matrix product states",
  LinearCombinationOfUnitaries: "LCU linear combination of unitaries", PhaseEstimation: "QPE",
  PhaseEstimationFilter: "QPE", DensityFunctionals: "DFT density functional theory",
  RayleighRitz: "variational principle", Kitaev: "BQP QMA history Hamiltonian",
  VQE: "variational quantum eigensolver", AaronsonAmbainis: "Aaronson Ambainis",
};
function normalize(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g,""); }
const searchable = theorems.map(n => {
  const terms = Object.entries(aliases).filter(([key]) => n.module.includes(key)).map(([,v]) => v);
  return normalize([n.name, n.module, labels[chapter(n)], ...terms].join(" "));
});
function matches() {
  const needle = normalize(byId("search").value.trim());
  return theorems.map((n, i) => [n, i]).filter(([n, i]) =>
    (!byId("chapter").value || chapter(n) === byId("chapter").value) && searchable[i].includes(needle));
}
function list() {
  const rows = matches();
  byId("count").textContent = rows.length + " matching theorem" + (rows.length === 1 ? "" : "s");
  byId("results").replaceChildren(...rows.map(([,i]) => card(i, null, "result")));
}
function drawWires() {
  const diagram = byId("diagram").getBoundingClientRect();
  const current = byId("current").firstElementChild;
  const layer = byId("wires").querySelector("g");
  layer.replaceChildren();
  if (!current || byId("wires").getBoundingClientRect().width === 0) return;
  function wire(a, b, kind) {
    const start = a.getBoundingClientRect(), end = b.getBoundingClientRect();
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    const coords = {x1:start.right-diagram.left, y1:start.top+start.height/2-diagram.top,
                    x2:end.left-diagram.left-1, y2:end.top+end.height/2-diagram.top};
    for (const [key, value] of Object.entries(coords)) line.setAttribute(key, value);
    if (kind === "via") line.setAttribute("stroke-dasharray","4 3");
    line.setAttribute("marker-end","url(#arrow)");
    layer.append(line);
  }
  for (const el of byId("before").querySelectorAll(".node")) wire(el, current, el.dataset.edge);
  for (const el of byId("after").querySelectorAll(".node")) wire(current, el, el.dataset.edge);
}
function neighborhood(id, edges, empty) {
  const box = byId(id);
  box.replaceChildren(...edges.map(([j, kind]) => card(j, kind, "neighbor")));
  if (!edges.length) {
    const msg = document.createElement("span");
    msg.className = "empty"; msg.textContent = empty; box.append(msg);
  }
}
function choose(i, navigate = true) {
  if (i < 0 || !theorems[i]) return;
  selected = i;
  const n = theorems[i];
  if (navigate && location.hash !== "#" + encodeURIComponent(n.name)) location.hash = encodeURIComponent(n.name);
  byId("module").textContent = n.module;
  byId("title").textContent = short(n);
  byId("source").href = n.url;
  byId("current").replaceChildren(card(i, null, "selected"));
  neighborhood("before", n.deps, n.external ? "Upstream proof boundary" : "No in-scope theorem prerequisites");
  neighborhood("after", n.users, "No in-scope dependents");
  list();
  drawWires();
}
function fromHash() {
  let requested = "";
  try { requested = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
  const i = theorems.findIndex(n => n.name === requested);
  const start = theorems.findIndex(n => n.name.endsWith(".VariationalMonteCarlo.variationalBound"));
  choose(i >= 0 ? i : Math.max(0,start), false);
}
for (const id of ["search","chapter"]) byId(id).addEventListener("input", list);
window.addEventListener("hashchange", fromHash);
new ResizeObserver(drawWires).observe(byId("diagram"));
fromHash();
</script>
